{% extends "vmconnectapp/base.html" %}

{% block content %}

<div id="table-container"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        fetch('api/v1/data')
            .then(response => response.json())
            .then(data => {
                new gridjs.Grid({
                    columns: [
                        { id: "id", name: "ID", hidden: true }, // Добавляем id
                        { id: "name", name: "Имя", 
                          attributes: (cell, row) => ({
                              contentEditable: false,
                              onBlur: (event) => updateData(event, row.cells[0].data, "name") // передаем id
                          }) 
                        },
                        { id: "resourcePool", name: "resourcePool", sort: true,
                          attributes: (cell, row) => ({
                              contentEditable: false,
                              onBlur: (event) => updateData(event, row.cells[0].data, "resourcePool") // передаем id
                          }) 
                        },
                        { id: "powerState", name: "powerState",
                          attributes: (cell, row) => ({
                              contentEditable: false,
                              onBlur: (event) => updateData(event, row.cells[0].data, "powerState") // передаем id
                          }) 
                        },
                    ],
                    data: data.data,
                    search: true,
                    sort: true,
                }).render(document.getElementById("table-container"));
            });
    
        function updateData(event, id, field) {
            let newValue = event.target.innerText;
            fetch(`api/v1/data/update/`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
                body: JSON.stringify({ id: id, field: field, value: newValue })
            }).then(response => response.json())
              .then(data => console.log(data));
        }
    
        function getCSRFToken() {
            return document.cookie.split('; ')
                .find(row => row.startsWith('csrftoken'))
                ?.split('=')[1];
        }
    });        
</script>

{% endblock content %}
