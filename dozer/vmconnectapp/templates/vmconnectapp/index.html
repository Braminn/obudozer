{% extends "vmconnectapp/base.html" %}

{% block content %}

<select id="filter-powerState" class="form-select" aria-label="Default select example">
    <option value="">Все</option>
    <option value="poweredOn">Включенные</option>
    <option value="poweredOff">Выключенные</option>
</select>
<div id="table-container"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        fetch('api/v1/data')
            .then(response => response.json())
            .then(data => {
                new gridjs.Grid({
                    columns: [
                        { id: "id", name: "ID", hidden: true }, // Скрытый ID
                        { 
                            name: "Виртуальная машина", 
                            formatter: (cell, row) => gridjs.html(`
                                <div>
                                    <strong contenteditable="true" 
                                            onBlur="updateData(event, '${row.cells[0].data}', 'name')">${row.cells[1].data}</strong> <br>
                                    <small>${row.cells[2].data}</small> <br>
                                    <small>${row.cells[3].data}</small>
                                </div>
                            `) 
                        },
                        { id: "resourcePool", name: "Resource Pool", hidden: true },
                        { id: "powerState", name: "Power State", hidden: true },
                        { 
                            name: "IP/VM Tools", 
                            formatter: (cell, row) => gridjs.html(`
                                <div>
                                    <strong>${row.cells[4].data}</strong> <br>
                                    <small>${row.cells[5].data}</small> <br>
                                    <small>${row.cells[6].data}</small>
                                </div>
                            `) 
                        },
                        { id: "ipAdress", name: "ipAdress", hidden: true },
                        { id: "toolsStatus", name: "toolsStatus", hidden: true },
                        { id: "vmtoolsdescription", name: "vmtoolsdescription", hidden: true },
                        { 
                            name: "Операционная система", 
                            formatter: (cell, row) => gridjs.html(`
                                <div>
                                    <strong>${row.cells[7].data}</strong> <br>
                                    <small>${row.cells[8].data} / ${row.cells[9].data}</small> <br>
                                    <small>${row.cells[10].data}</small>
                                </div>
                            `) 
                        },
                        { id: "prettyName", name: "prettyName", hidden: true },
                        { id: "familyName", name: "familyName", hidden: true },
                        { id: "bitness", name: "bitness", hidden: true },
                        { id: "kernelVersion", name: "kernelVersion", hidden: true },
                        { 
                            name: "Назначение / Владелец", 
                            formatter: (cell, row) => gridjs.html(`
                                <div>
                                    <strong contenteditable="true" 
                                            onBlur="updateData(event, '${row.cells[0].data}', 'owner')">${row.cells[11].data}</strong> <br>
                                    <strong contenteditable="true" 
                                            onBlur="updateData(event, '${row.cells[0].data}', 'cms')">${row.cells[12].data}</strong> <br> 
                                </div>
                            `) 
                        },
                        { id: "owner", name: "owner", hidden: true },
                        { id: "cms", name: "cms", hidden: true },
                    ],
                    data: data.data.map(vm => [
                        vm.id,                  // 0
                        vm.name,                // 1
                        vm.resourcePool,        // 2
                        vm.powerState,          // 3
                        vm.ipAdress,            // 4
                        vm.toolsStatus,         // 5
                        vm.vmtoolsdescription,  // 6
                        vm.prettyName,          // 7
                        vm.familyName,          // 8
                        vm.bitness,             // 9
                        vm.kernelVersion,       // 10
                        vm.owner,               // 11
                        vm.cms,                 // 12
                    ]),
                    search: true,
                    sort: true,
                }).render(document.getElementById("table-container"));
            });
    });

    function updateData(event, id, field) {
        let newValue = event.target.innerText;
        fetch(`api/v1/data/update/`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
            body: JSON.stringify({ id: id, field: field, value: newValue })
        }).then(response => response.json())
          .then(data => console.log(data))
          .catch(error => console.error("Ошибка обновления:", error));
    }

    function getCSRFToken() {
        return document.cookie.split('; ')
            .find(row => row.startsWith('csrftoken'))
            ?.split('=')[1];
    }
</script>



{% endblock content %}
