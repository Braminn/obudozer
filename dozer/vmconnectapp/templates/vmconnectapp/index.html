{% extends "vmconnectapp/base.html" %}

{% block content %}

<div class="filter-container">
    <label for="filter-powerState" class="form-label">Фильтр по состоянию:</label>
    <select id="filter-powerState" class="form-select" aria-label="Фильтр по состоянию ВМ">
        <option value="">Все</option>
        <option value="poweredOn">Включенные</option>
        <option value="poweredOff">Выключенные</option>
    </select>
</div>
<div id="table-container"></div>

<style>
    .filter-container {
        margin-bottom: 20px;
        max-width: 300px; /* Ограничиваем ширину фильтра */
    }
    .form-label {
        font-weight: bold;
        margin-bottom: 5px;
        display: block; /* Для размещения над select */
    }
    .form-select {
        padding: 8px 12px; /* Увеличиваем отступы внутри */
        border-radius: 6px; /* Скругляем углы */
        border: 1px solid #ced4da; /* Стандартная граница Bootstrap */
        background-color: #fff; /* Белый фон */
        transition: border-color 0.2s ease-in-out; /* Плавный переход для фокуса */
    }
    .form-select:focus {
        border-color: #007bff; /* Цвет границы при фокусе */
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5); /* Легкая тень */
        outline: none; /* Убираем стандартный outline */
    }
    /* Стили для Grid.js таблицы (опционально) */
    .gridjs-container {
        margin-top: 20px;
    }
    .gridjs-table {
        width: 100%;
        border-collapse: collapse;
    }
    .gridjs-th, .gridjs-td {
        padding: 10px;
        border: 1px solid #dee2e6; /* Границы ячеек как в Bootstrap */
    }
    .gridjs-th {
        background-color: #f8f9fa; /* Светлый фон для заголовков */
        font-weight: bold;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        let originalData;
        let grid;

        fetch('api/v1/data')
            .then(response => response.json())
            .then(data => {
                console.log('Данные с бэкенда:', data);
                originalData = data.data;

                grid = new gridjs.Grid({
                    columns: [
                        { id: "name", name: "Имя ВМ" },
                        { id: "resourcePool", name: "Resource Pool" },
                        { id: "powerState", name: "Power State" },
                        { id: "ipAdress", name: "IP-адрес" },
                        { id: "vmtoolsdescription", name: "VM Tools Description" },
                        { id: "prettyName", name: "Pretty Name" },
                        { 
                            id: "creation_date", 
                            name: "Дата создания",
                            formatter: (cell) => {
                                if (cell) {
                                    const d = new Date(cell);
                                    return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
                                }
                                return '-';
                            }
                        }
                    ],
                    data: originalData,
                    search: true,
                    sort: true,
                }).render(document.getElementById("table-container"));

                // Фильтр по powerState
                document.getElementById('filter-powerState').addEventListener('change', function () {
                    const filterValue = this.value;
                    const filteredData = filterValue
                        ? originalData.filter(vm => vm.powerState === filterValue)
                        : originalData;
                    grid.updateConfig({ data: filteredData }).forceRender();
                });
            })
            .catch(error => console.error('Ошибка загрузки данных:', error));
    });
</script>

{% endblock content %}
